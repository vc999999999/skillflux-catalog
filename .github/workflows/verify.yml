name: Verify catalog
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install skillflux CLI from the main repository
        run: npm install --no-save github:vc999999999/Skillflux_Cloudflare#main
      - name: Check index.json matches the skills directory
        run: npx --no-install skillflux catalog --check .
